<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bfff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="128" cy="128" r="128" fill="url(#grad1)"/>
  
  <!-- Envelope (Email) -->
  <rect x="50" y="80" width="156" height="96" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Envelope flap -->
  <polygon points="50,80 128,130 206,80" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Checkmark (Security) -->
  <circle cx="200" cy="160" r="28" fill="#4CAF50"/>
  <path d="M 195 160 L 200 165 L 210 155" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Location pin -->
  <g transform="translate(65, 175)">
    <circle cx="0" cy="0" r="6" fill="#ff6b6b"/>
    <path d="M -8,-8 L 8,-8 L 8,8 L 0,16 L -8,8 Z" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MailCerto</text>
</svg>
