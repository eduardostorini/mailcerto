<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="55%" stop-color="#0099E6"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="env" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF4FF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(0,-2)">
    <rect x="44" y="88" width="168" height="104" rx="12" fill="url(#env)"/>
    <polygon points="44,88 128,146 212,88" fill="none" stroke="#0066CC" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="44,88 128,146 212,88" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <g>
    <circle cx="192" cy="160" r="30" fill="#16A34A"/>
    <circle cx="192" cy="160" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <polyline points="180,160 189,170 206,152" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(68,180)">
    <circle cx="0" cy="0" r="7" fill="#EF4444"/>
    <path d="M-9,-9 L9,-9 L9,9 L0,18 L-9,9 Z" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
